# The engine's checks and the requests to the R server, on every push and pull request: on
# Windows, on macOS (Apple silicon and Intel) and on Linux with the distributions' own R. Linux
# also builds the packages (.deb, AppImage, .tar.gz), installs the .deb with what it depends on,
# and uses the installed program end to end (app/tests/essai_appli.js), then through the
# workflows people do (app/tests/essai_parcours.js); Windows builds the program (no installer)
# and macOS Nuée.app and its .dmg, and use them the same way. The packages stay with the run, and
# are added to a release when it is published.
# (verifier_references.R needs exported .usp projects that are not in the repository.)
name: Vérifications

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # R from CRAN, the version the Windows build ships (app/construire.js)
      - name: R
        shell: pwsh
        run: |
          $v = '4.6.2'
          Invoke-WebRequest "https://cloud.r-project.org/bin/windows/base/old/$v/R-$v-win.exe" -OutFile "$env:RUNNER_TEMP\R.exe"
          Start-Process "$env:RUNNER_TEMP\R.exe" -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES', '/DIR=C:\R' -Wait
          Add-Content $env:GITHUB_PATH 'C:\R\bin'

      # (in R's own library, which the build copies)
      - name: Paquets R
        run: Rscript -e "install.packages(c('jsonlite', 'httpuv', 'openxlsx', 'haven', 'readxl', 'RSQLite', 'prospectr', 'knitr', 'jmvReadWrite', 'vegan', 'sf', 'spdep', 'gstat', 'rtrim', 'indicspecies', 'ranger', 'gbm', 'terra', 'Distance'), lib = .Library, repos = 'https://cloud.r-project.org')"

      - name: Vérifications du moteur
        shell: bash
        run: |
          for f in formats spectres fichiers_spectres opls jeu_test ipls comparaisons regression resultats moyennes script observations tableaux validation ordination classement spatial par_reponse indicatrices rarefaction texte_resultats reproductible trim communautes familles forets boosting raster distance donnees kobo vitesse langue; do
            echo "::group::verifier_$f"
            Rscript moteur/tests/verifier_$f.R
            echo "::endgroup::"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Electron comes from GitHub's releases: kept between runs, and fetched through GitHub's API
      # with this job's token (its own downloader goes anonymously, which GitHub throttles at times)
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-windows-${{ hashFiles('app/package-lock.json') }}

      - name: Fichiers des versions GitHub, par l'API
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Start-Process node -ArgumentList '.github/miroir-github.js', '8123' -RedirectStandardOutput "$env:RUNNER_TEMP\miroir.log" -RedirectStandardError "$env:RUNNER_TEMP\miroir-erreurs.log"
          Add-Content $env:GITHUB_ENV 'ELECTRON_MIRROR=http://127.0.0.1:8123/electron/electron/'

      # (Electron too: the program is built below)
      - name: Paquets de l'interface
        working-directory: app
        run: npm ci

      - name: Requêtes au serveur R
        working-directory: app
        run: node tests/essai_api.js Rscript

      # (the updater reinstalls for all users or for this user, as the installer's entry says)
      - name: Mode d'installation, pour la mise à jour
        working-directory: app
        run: node tests/essai_installation.js

      # the .usp converter, compiled with PyInstaller as the build does it
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: PyInstaller
        run: python -m pip install pyinstaller

      # The program as the network-share folder holds it (Nuee\application, R copied from C:\R),
      # without its installer, which is never run here; essai_api.js ran above. Then used end to
      # end (app/tests/essai_appli.js), and through the workflows people do (essai_parcours.js).
      - name: Nuée pour Windows
        working-directory: app
        env:
          SANS_ESSAI: '1'
          SANS_INSTALLATEUR: '1'
        run: node construire.js ../dist C:\R

      - name: Nuée, de bout en bout
        working-directory: app
        run: node tests/essai_appli.js ../dist/Nuee/application/Nuee.exe ../dist/windows.png

      - name: Les parcours, de bout en bout
        working-directory: app
        run: node tests/essai_parcours.js ../dist/Nuee/application/Nuee.exe ../dist/windows-parcours

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-windows
          path: dist/*.png

  # The update from 0.9.9 keeps Nuée's shortcuts and taskbar pin (app/installateur.nsh): 0.9.9 as
  # published, installed, then this version's installer around a stand-in application, run as
  # 0.9.9's updater runs it and as this version's does (app/tests/essai_mise_a_jour.js).
  mise-a-jour:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Paquets de l'interface
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Mise à jour depuis la 0.9.9, raccourcis et épingle gardés
        working-directory: app
        run: node tests/essai_mise_a_jour.js

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: R d'Ubuntu, avec les paquets dont dépend le .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-httpuv r-cran-jsonlite r-cran-openxlsx r-cran-haven r-cran-readxl r-cran-foreign r-cran-nlme r-cran-mgcv r-cran-knitr r-cran-mass r-cran-rpart r-cran-cluster r-cran-rsqlite r-cran-sf r-cran-spdep r-cran-gstat r-cran-ranger r-cran-terra xvfb xauth
          Rscript -e 'cat(R.version.string, "\n")'

      - name: Vérifications du moteur
        run: |
          for f in formats spectres fichiers_spectres opls jeu_test ipls comparaisons regression resultats moyennes script observations tableaux validation ordination classement spatial par_reponse indicatrices rarefaction texte_resultats reproductible trim communautes familles forets boosting raster distance donnees kobo vitesse langue; do
            echo "::group::verifier_$f"
            Rscript moteur/tests/verifier_$f.R
            echo "::endgroup::"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Electron and electron-builder's tools come from GitHub releases: kept between runs, and
      # fetched through GitHub's API with this job's token (their own downloaders go anonymously,
      # which GitHub throttles at times)
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('app/package-lock.json') }}

      - name: Fichiers des versions GitHub, par l'API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nohup node .github/miroir-github.js 8123 > "$RUNNER_TEMP/miroir.log" 2>&1 &
          echo "ELECTRON_MIRROR=http://127.0.0.1:8123/electron/electron/" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=http://127.0.0.1:8123/electron-userland/electron-builder-binaries/" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_BINARIES_ALLOW_HTTP=true" >> "$GITHUB_ENV"

      # (construire.js runs tests/essai_api.js first)
      - name: Paquets Linux
        working-directory: app
        run: |
          npm ci
          node construire.js ../dist

      - name: Installation du .deb
        run: sudo apt-get install -y ./dist/installateur/Nuee-*-amd64.deb

      - name: Nuée installée, de bout en bout
        working-directory: app
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node tests/essai_appli.js '/opt/Nuée/nuee' ../dist/ubuntu-24.04-deb.png

      # Run as people do, mounted with FUSE 2. Ubuntu 24.04 keeps unprivileged user namespaces,
      # and so Chromium's sandbox, to programs with an AppArmor profile: the .deb installs one,
      # an AppImage there needs --no-sandbox
      - name: AppImage, de bout en bout
        working-directory: app
        run: |
          sudo apt-get install -y --no-install-recommends libfuse2t64
          chmod +x ../dist/installateur/Nuee-*.AppImage
          xvfb-run -a -s '-screen 0 1600x1000x24' node tests/essai_appli.js ../dist/installateur/Nuee-*.AppImage ../dist/ubuntu-24.04-appimage.png --no-sandbox

      # the workflows people do, through the window of the installed program (app/tests/essai_parcours.js)
      - name: Les parcours, de bout en bout
        working-directory: app
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node tests/essai_parcours.js '/opt/Nuée/nuee' ../dist/ubuntu-24.04-parcours

      - uses: actions/upload-artifact@v7
        with:
          name: nuee-linux
          path: dist/installateur/Nuee-*

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-ubuntu-24.04
          path: dist/*.png

  # The same .deb on older distributions, whose R is older: Debian 12 (R 4.2), Ubuntu 22.04 (R 4.1)
  linux-distributions:
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:12', nom: debian-12 }
          - { image: 'ubuntu:22.04', nom: ubuntu-22.04 }
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8  # (the images have no locale; the engine's files are in UTF-8)
    steps:
      - name: Outils
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates xvfb xauth

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nuee-linux
          path: paquets

      # (then every library the program loads must have come with the .deb's dependencies)
      - name: Installation du .deb, R et ses paquets avec
        run: |
          apt-get install -y ./paquets/Nuee-*-amd64.deb
          Rscript -e 'cat(R.version.string, "\n")'
          if ldd '/opt/Nuée/nuee' | grep 'not found'; then exit 1; fi

      - name: Vérifications du moteur
        run: |
          for f in formats spectres fichiers_spectres opls jeu_test ipls comparaisons regression resultats moyennes script observations tableaux validation ordination classement spatial par_reponse indicatrices rarefaction texte_resultats reproductible trim communautes familles forets boosting raster distance donnees kobo vitesse langue; do
            echo "::group::verifier_$f"
            Rscript moteur/tests/verifier_$f.R
            echo "::endgroup::"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Paquets de l'interface
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Requêtes au serveur R
        working-directory: app
        run: node tests/essai_api.js Rscript

      # (as root in a container: Chromium's sandbox needs --no-sandbox there)
      - name: Nuée installée, de bout en bout
        working-directory: app
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node tests/essai_appli.js '/opt/Nuée/nuee' ../${{ matrix.nom }}.png --no-sandbox

      # (app/tests/essai_parcours.js, with that distribution's R)
      - name: Les parcours, de bout en bout
        working-directory: app
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node tests/essai_parcours.js '/opt/Nuée/nuee' ../${{ matrix.nom }}-parcours --no-sandbox

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-${{ matrix.nom }}
          path: ${{ matrix.nom }}*.png

  # macOS, on Apple silicon and on Intel: CRAN's R 4.6.2 from its .pkg, the R Nuée.app brings along
  # (app/construire.js), with the engine's packages. The engine's checks, the requests to the R
  # server, then the build (Nuée.app and its .dmg), used end to end once the R of
  # /Library/Frameworks is moved away: Nuée must run on the R it brings, on a Mac without R.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, cran: sonoma-arm64 }
          - { runner: macos-15-intel, arch: x86_64, cran: big-sur-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: R
        run: |
          curl -sSfL -o "$RUNNER_TEMP/R.pkg" "https://cloud.r-project.org/bin/macosx/${{ matrix.cran }}/base/R-4.6.2-${{ matrix.arch }}.pkg"
          sudo installer -pkg "$RUNNER_TEMP/R.pkg" -target /
          Rscript -e 'cat(R.version.string, R.version$arch, "\n")'

      # (in R's own library, which the build copies)
      - name: Paquets R
        run: sudo Rscript -e "install.packages(c('jsonlite', 'httpuv', 'openxlsx', 'haven', 'readxl', 'RSQLite', 'prospectr', 'knitr', 'jmvReadWrite', 'vegan', 'sf', 'spdep', 'gstat', 'rtrim', 'indicspecies', 'ranger', 'gbm', 'terra', 'Distance'), lib = .Library, repos = 'https://cloud.r-project.org')"

      - name: Vérifications du moteur
        run: |
          for f in formats spectres fichiers_spectres opls jeu_test ipls comparaisons regression resultats moyennes script observations tableaux validation ordination classement spatial par_reponse indicatrices rarefaction texte_resultats reproductible trim communautes familles forets boosting raster distance donnees kobo vitesse langue; do
            echo "::group::verifier_$f"
            Rscript moteur/tests/verifier_$f.R
            echo "::endgroup::"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # the .usp converter, compiled with PyInstaller as on Windows
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: PyInstaller
        run: python3 -m pip install pyinstaller

      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-macos-${{ matrix.arch }}-${{ hashFiles('app/package-lock.json') }}

      - name: Fichiers des versions GitHub, par l'API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nohup node .github/miroir-github.js 8123 > "$RUNNER_TEMP/miroir.log" 2>&1 &
          echo "ELECTRON_MIRROR=http://127.0.0.1:8123/electron/electron/" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=http://127.0.0.1:8123/electron-userland/electron-builder-binaries/" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_BINARIES_ALLOW_HTTP=true" >> "$GITHUB_ENV"

      # (construire.js runs tests/essai_api.js first; tests/essai_r_macos.js checks r-macos.js)
      - name: Nuée.app et l'image disque
        working-directory: app
        run: |
          npm ci
          node tests/essai_r_macos.js
          node construire.js ../dist

      - name: Sans le R de /Library/Frameworks
        run: sudo mv /Library/Frameworks/R.framework "$RUNNER_TEMP/R.framework"

      - name: Nuée, de bout en bout
        working-directory: app
        run: node tests/essai_appli.js '../dist/Nuee/Nuée.app/Contents/MacOS/Nuée' ../dist/macos-${{ matrix.arch }}.png

      # the same, from the .dmg as people get it
      - name: Image disque, de bout en bout
        working-directory: app
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" ../dist/installateur/Nuee-*.dmg
          node tests/essai_appli.js "$RUNNER_TEMP/dmg/Nuée.app/Contents/MacOS/Nuée" ../dist/macos-${{ matrix.arch }}-dmg.png
          hdiutil detach "$RUNNER_TEMP/dmg"

      # the workflows people do, through the window of Nuée.app (app/tests/essai_parcours.js)
      - name: Les parcours, de bout en bout
        working-directory: app
        run: node tests/essai_parcours.js '../dist/Nuee/Nuée.app/Contents/MacOS/Nuée' ../dist/macos-${{ matrix.arch }}-parcours

      - uses: actions/upload-artifact@v7
        with:
          name: nuee-macos-${{ matrix.arch }}
          path: dist/installateur/Nuee-*.dmg

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-macos-${{ matrix.arch }}
          path: dist/*.png

  # A published release gets the macOS images, once both Macs' checks have passed
  macos-version-publiee:
    if: github.event_name == 'release'
    needs: macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nuee-macos-*
          merge-multiple: true
          path: paquets

      - name: Images disque ajoutées à la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' paquets/Nuee-*.dmg --clobber --repo '${{ github.repository }}'

  # A published release gets the Linux packages, once every Linux check has passed
  linux-version-publiee:
    if: github.event_name == 'release'
    needs: [linux, linux-distributions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuee-linux
          path: paquets

      - name: Paquets ajoutés à la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' paquets/Nuee-* --clobber --repo '${{ github.repository }}'
