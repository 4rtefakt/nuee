# The engine's checks and the requests to the R server, on every push and pull request.
# (verifier_references.R needs exported .usp projects that are not in the repository.)
name: Vérifications

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # R from CRAN, the version the Windows build ships (app/construire.js)
      - name: R
        shell: pwsh
        run: |
          $v = '4.6.2'
          Invoke-WebRequest "https://cloud.r-project.org/bin/windows/base/old/$v/R-$v-win.exe" -OutFile "$env:RUNNER_TEMP\R.exe"
          Start-Process "$env:RUNNER_TEMP\R.exe" -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES', '/DIR=C:\R' -Wait
          Add-Content $env:GITHUB_PATH 'C:\R\bin'

      - name: Paquets R
        run: Rscript -e "install.packages(c('jsonlite', 'httpuv', 'openxlsx', 'haven', 'readxl', 'prospectr', 'knitr', 'jmvReadWrite'), repos = 'https://cloud.r-project.org')"

      - name: Vérifications du moteur
        shell: bash
        run: |
          for f in formats spectres fichiers_spectres opls jeu_test ipls comparaisons script validation; do
            echo "::group::verifier_$f"
            Rscript moteur/tests/verifier_$f.R
            echo "::endgroup::"
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Requêtes au serveur R
        working-directory: app
        run: node tests/essai_api.js Rscript
